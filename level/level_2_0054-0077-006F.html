<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Level 2</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

canvas {
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
}

#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(0,0,0,0.85);
  pointer-events: auto;
}

.screen.active { display: flex; }

.title {
  font-size: 56px;
  color: white;
  margin-bottom: 30px;
}

.pixel-btn {
  padding: 14px 30px;
  font-size: 20px;
  background: black;
  color: white;
  border: 4px solid white;
  cursor: pointer;
}

#jumpBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  padding: 16px 26px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="ui">
  <div id="menu" class="screen active">
    <h1 class="title">LEVEL 2</h1>
    <button class="pixel-btn" id="startBtn">▶ TAP TO START</button>
  </div>

  <div id="win" class="screen">
    <h1 class="title">LEVEL COMPLETE</h1>
    <button class="pixel-btn" onclick="location.reload()">⟳ PLAY AGAIN</button>
  </div>

  <div id="gameOver" class="screen">
    <h1 class="title">GAME OVER</h1>
    <button class="pixel-btn" onclick="location.reload()">⟳ RETRY</button>
  </div>
</div>

<canvas id="gameCanvas" width="1024" height="720"></canvas>
<button id="jumpBtn">Double<br>JUMP</button>

<script>
/* ================= INPUT ================= */
let jumpPressed = false;

window.addEventListener("keydown", e => {
  if (e.code === "Space") jumpPressed = true;
});

window.addEventListener("keyup", e => {
  if (e.code === "Space") jumpPressed = false;
});

jumpBtn.onclick = () => {
  jumpPressed = true;
  setTimeout(() => jumpPressed = false, 120);
};

/* ================= PLAYER (DOUBLE JUMP) ================= */
class Player {
  constructor() {
    this.x = 150;
    this.y = 500;

    this.width = 128;
    this.height = 128;

    this.hitbox = { xOffset: 30, yOffset: 20, width: 70, height: 90 };

    this.velocityY = 0;
    this.gravity = 1.4;

    this.jumpForce = -30;
    this.doubleJumpForce = -24;

    this.maxJumps = 2;
    this.jumpCount = 0;

    this.frameX = 0;
    this.maxFrames = 4;
    this.frameTimer = 0;
    this.frameInterval = 6;

    this.runImg = new Image();
    this.runImg.src = "../assets/player/run.png";

    this.jumpImg = new Image();
    this.jumpImg.src = "../assets/player/jump.png";
    this.jumpFrame = 0;
  }

  update() {
    if (jumpPressed && this.jumpCount < this.maxJumps) {
      this.velocityY =
        this.jumpCount === 0 ? this.jumpForce : this.doubleJumpForce;
      this.jumpCount++;
      // 🎯 PICK RANDOM JUMP POSE (0–3)
      this.jumpFrame = Math.floor(Math.random() * 4);
      jumpPressed = false;
    }

    this.velocityY += this.gravity;
    this.y += this.velocityY;

    if (this.y >= 500) {
      this.y = 500;
      this.velocityY = 0;
      this.jumpCount = 0;
    }
    if (this.jumpCount === 0) {
    this.frameTimer++;
    }
    this.frameTimer++;
    if (this.frameTimer >= this.frameInterval) {
      this.frameX = (this.frameX + 1) % 4;
      this.frameTimer = 0;
    }
  }

  draw(ctx) {
  if (this.jumpCount > 0) {
    // 🦘 STATIC RANDOM JUMP POSE
    ctx.drawImage(
      this.jumpImg,
      this.jumpFrame * 128,
      0,
      128,
      128,
      this.x,
      this.y,
      this.width,
      this.height
    );
  } else {
    // 🏃 RUN ANIMATION
    ctx.drawImage(
      this.runImg,
      this.frameX * 128,
      0,
      128,
      128,
      this.x,
      this.y,
      this.width,
      this.height
    );
  }
}

  getHitbox() {
    return {
      x: this.x + this.hitbox.xOffset,
      y: this.y + this.hitbox.yOffset,
      width: this.hitbox.width,
      height: this.hitbox.height
    };
  }
}

/* ================= OBSTACLE ================= */
class Obstacle {
  constructor(worldX) {
    this.worldX = worldX;
    this.y = 570 - 128;
    this.width = 80;
    this.height = 128;

    this.img = new Image();
    this.img.src = "../assets/obstacles/rock.png";
  }

  draw(ctx, camX, playerX) {
    ctx.drawImage(
      this.img,
      this.worldX - camX + playerX,
      this.y,
      this.width,
      this.height +56
    );
  }

  getHitbox(camX, playerX) {
    const x = this.worldX - camX + playerX;
    return { x, y: this.y, width: this.width, height: this.height };
  }
}

/* ================= GAME ================= */
const canvas = gameCanvas;
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "../assets/background/background_1.png";

const flagImg = new Image();
flagImg.src = "../assets/ui/flag_2.png";

const LEVEL_END_X = 6000;
const GROUND_Y = 570;

let worldX = 0;
let player;
let obstacles = [];
let playing = false;

/* ===== RANDOM OBSTACLE LOGIC ===== */
const BASE_GAP = 460;      // constant gap
const VAR_GAP = 180;       // randomness
const START_X = 600;

function generateObstacles() {
  obstacles = [];
  let x = START_X;

  while (x < LEVEL_END_X - 400) {
    obstacles.push(new Obstacle(x));
    x += BASE_GAP + Math.random() * VAR_GAP;
  }
}

/* ================= UI ================= */
startBtn.onclick = () => {
  player = new Player();
  worldX = 0;
  generateObstacles();
  playing = true;
  menu.classList.remove("active");
};

/* ================= LOOP ================= */
function gameLoop() {
  requestAnimationFrame(gameLoop);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  if (!playing) return;

  player.update();
  player.draw(ctx);

  obstacles.forEach(o => {
    o.draw(ctx, worldX, player.x);

    const p = player.getHitbox();
    const h = o.getHitbox(worldX, player.x);

    if (
      p.x < h.x + h.width &&
      p.x + p.width > h.x &&
      p.y < h.y + h.height &&
      p.y + p.height > h.y
    ) {
      playing = false;
      gameOver.classList.add("active");
    }
  });

  /* ===== FINISH FLAG ===== */
  const flagX = LEVEL_END_X - worldX + player.x;
  ctx.drawImage(
        flagImg,
        flagX + 100,
        371,
        256,
        256
      );

  if (worldX > LEVEL_END_X) {
    playing = false;
    win.classList.add("active");
  }

  worldX += 6;
}

gameLoop();
</script>
</body>

</html>
