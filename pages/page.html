<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kid Goku Run</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  text-align: center;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  width: 100vw;
  height: 100vh;
}

#jumpBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  padding: 15px 25px;
  font-size: 18px;
}

#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: radial-gradient(#000000aa, #000000ee);
  pointer-events: auto;
}

.screen.active { display: flex; }

.title {
  font-size: 64px;
  color: white;
  margin-bottom: 40px;
  text-shadow: 4px 4px 0 black;
}

.red { color: #ff4c4c; }
.green { color: #4cff4c; }

.pixel-btn {
  font-size: 22px;
  padding: 15px 35px;
  margin: 10px;
  border: 4px solid white;
  background: black;
  color: white;
  cursor: pointer;
}

.pixel-btn:hover { transform: scale(1.1); }
</style>
</head>

<body>

<!-- UI -->
<div id="ui">
  <div id="menu" class="screen active">
    <h1 class="title">Level 1</h1>
    <button class="pixel-btn" id="startBtn">▶ TAP TO START</button>
  </div>

  <div id="gameOver" class="screen">
    <h1 class="title red">GAME OVER</h1>
    <button class="pixel-btn" id="retryBtn">⟳ RETRY</button>
    <button class="pixel-btn" id="homeBtn1">🏠 Pause and Retry</button>
  </div>

  <div id="win" class="screen">
    <h1 class="title green">LEVEL COMPLETE</h1>
    <button class="pixel-btn" id="retryBtn2">⟳ PLAY AGAIN</button>
    <button class="pixel-btn" id="homeBtn2">🏠 Pause and Retry</button>
  </div>
</div>

<canvas id="gameCanvas" width="1024" height="720"></canvas>
<button id="jumpBtn">JUMP</button>

<script>
/* ================= INPUT ================= */
let jumpPressed = false;

window.addEventListener("keydown", e => {
  if (e.code === "Space") jumpPressed = true;
});

window.addEventListener("keyup", e => {
  if (e.code === "Space") jumpPressed = false;
});

document.getElementById("jumpBtn").onclick = () => {
  jumpPressed = true;
  setTimeout(() => jumpPressed = false, 120);
};

/* ================= PLAYER ================= */
class Player {
  constructor() {
    this.x = 150;
    this.y = 500;
    this.spriteWidth = 128;
    this.spriteHeight = 128;
    this.width = 128;
    this.height = 128;

    this.hitbox = { xOffset: 30, yOffset: 20, width: 70, height: 90 };

    this.velocityY = 0;
    this.gravity = 1.4;
    this.jumpForce = -30;
    this.grounded = true;

    this.frameX = 0;
    this.maxFrames = 4;
    this.frameTimer = 0;
    this.frameInterval = 6;

    this.runImg = new Image();
    this.runImg.src = "../assets/player/run.png";

    this.jumpImg = new Image();
    this.jumpImg.src = "../assets/player/jump.png";
  }

  update() {
    if (jumpPressed && this.grounded) {
      this.velocityY = this.jumpForce;
      this.grounded = false;
    }

    this.velocityY += this.gravity;
    this.y += this.velocityY;

    if (this.y >= 500) {
      this.y = 500;
      this.velocityY = 0;
      this.grounded = true;
    }

    if (this.grounded) {
      this.frameTimer++;
      if (this.frameTimer >= this.frameInterval) {
        this.frameX = (this.frameX + 1) % this.maxFrames;
        this.frameTimer = 0;
      }
    }
  }

  draw(ctx) {
    const img = this.grounded ? this.runImg : this.jumpImg;
    ctx.drawImage(
      img,
      this.frameX * this.spriteWidth,
      0,
      this.spriteWidth,
      this.spriteHeight,
      this.x,
      this.y,
      this.width,
      this.height
    );
  }

  getHitbox() {
    return {
      x: this.x + this.hitbox.xOffset,
      y: this.y + this.hitbox.yOffset,
      width: this.hitbox.width,
      height: this.hitbox.height
    };
  }
}

/* ================= OBSTACLE ================= */
class Obstacle {
  constructor(worldX) {
    this.worldX = worldX;
    this.y = 570;
    this.width = 64;
    this.height = 64;
    this.hitbox = { xOffset: 10, yOffset: 10, width: 44, height: 44 };

    this.img = new Image();
    this.img.src = "../assets/obstacles/spike.png";
  }

  draw(ctx, camX, playerX) {
    ctx.drawImage(this.img, this.worldX - camX + playerX, this.y - 5, this.width, this.height);
  }

  getHitbox(camX, playerX) {
    const x = this.worldX - camX + playerX;
    return {
      x: x + this.hitbox.xOffset,
      y: this.y + this.hitbox.yOffset,
      width: this.hitbox.width,
      height: this.hitbox.height
    };
  }
}

/* ================= GAME ================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "../assets/background/background_1.png";

const flagImg = new Image();
flagImg.src = "../assets/ui/flag_1.png";

const MENU = 0, PLAYING = 1, GAME_OVER = 2, WIN = 3;
let gameState = MENU;

let player;
let obstacles = [];
let worldX = 0;

const finishX = 4000;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  if (id) document.getElementById(id).classList.add("active");
}

function resetGame() {
  player = new Player();
  obstacles = [];
  worldX = 0;

  for (let i = 0; i < 12; i++) {
    obstacles.push(new Obstacle(600 + i * 280));
  }
}

document.getElementById("startBtn").onclick =
document.getElementById("retryBtn").onclick =
document.getElementById("retryBtn2").onclick = () => {
  resetGame();
  gameState = PLAYING;
  showScreen(null);
};

document.getElementById("homeBtn1").onclick =
document.getElementById("homeBtn2").onclick = () => {
  gameState = MENU;
  showScreen("menu");
};

function gameLoop() {
  requestAnimationFrame(gameLoop);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  if (gameState !== PLAYING) return;

  player.update();
  player.draw(ctx);

  obstacles.forEach(o => {
    o.draw(ctx, worldX, player.x);
    const p = player.getHitbox();
    const h = o.getHitbox(worldX, player.x);

    if (p.x < h.x + h.width && p.x + p.width > h.x &&
        p.y < h.y + h.height && p.y + p.height > h.y) {
      gameState = GAME_OVER;
      showScreen("gameOver");
    }
  });
    const flagX = finishX - worldX + player.x;

      ctx.drawImage(
        flagImg,
        flagX + 100,
        371,
        256,
        256
      );
  worldX += 6;

  if (worldX > finishX) {
    gameState = WIN;
    showScreen("win");
  }
}

showScreen("menu");
gameLoop();
</script>

</body>

</html>
